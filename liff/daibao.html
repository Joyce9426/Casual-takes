<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>代報名</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #F5F7F8;
    color: #16211C;
    padding: 20px 18px 32px;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .subtitle { font-size: 13px; color: #6C6C6C; margin: 0 0 20px; }
  label { display: block; font-size: 14px; font-weight: bold; margin: 16px 0 8px; }
  input[type="text"] {
    width: 100%;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid #D5DAD8;
    border-radius: 8px;
    background: #fff;
  }
  .gender-row { display: flex; gap: 10px; }
  .gender-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 8px;
    border: 1px solid #D5DAD8;
    background: #fff;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
  }
  .gender-btn.selected.male { background: #4A90E2; border-color: #4A90E2; color: #fff; }
  .gender-btn.selected.female { background: #E24A8E; border-color: #E24A8E; color: #fff; }
  .checklist { margin-top: 4px; }
  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border: 1px solid #D5DAD8;
    border-radius: 8px;
    background: #fff;
    margin-bottom: 8px;
  }
  .check-item input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
  .check-item .who { font-size: 15px; font-weight: bold; }
  .check-item .tag { font-size: 12px; color: #6C6C6C; margin-left: 6px; font-weight: normal; }
  .empty-note { font-size: 14px; color: #6C6C6C; padding: 20px 0; text-align: center; }
  .log-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 11px 14px;
    border: 1px solid #D5DAD8;
    border-radius: 8px;
    background: #fff;
    margin-bottom: 8px;
  }
  .log-item .time { font-size: 12px; color: #9D9D9D; }
  .log-item .who { font-size: 14px; font-weight: bold; }
  .log-item .action { font-size: 14px; color: #16211C; }
  .log-more { font-size: 12px; color: #9D9D9D; text-align: center; margin-top: 4px; }
  .submit-btn {
    width: 100%;
    margin-top: 26px;
    padding: 14px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #0F6E56;
  }
  .submit-btn:disabled { background: #A9B7B1; }
  .cancel-mode .submit-btn { background: #B3261E; }
  /* 結果文字改成貼在頂部、跟著捲動位置固定住（sticky）——名單/勾選清單
     筆數一多，頁面會變長，結果文字如果留在最下面，送出後很容易被擋在畫面
     外看不到，一定要滾到底才看得到。 */
  .status {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #F5F7F8;
    margin: 0 0 14px;
    padding: 8px 0;
    font-size: 14px;
    color: #6C6C6C;
    text-align: center;
    min-height: 20px;
  }
  .status:empty { padding: 0; margin: 0; min-height: 0; }
  .status.error { color: #B3261E; }
  .roster-summary { margin-top: 4px; }
  .roster-group {
    padding: 12px 14px;
    border: 1px solid #D5DAD8;
    border-radius: 8px;
    background: #fff;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.6;
  }
  .roster-group .label { font-weight: bold; margin-right: 6px; }
</style>
</head>
<body>
  <h1 id="heading">代報名</h1>
  <p class="subtitle" id="subtitle">請輸入要報名的人的姓名與性別</p>
  <p class="status" id="status"></p>

  <form id="form">
    <div id="registerFields">
      <label for="name">姓名</label>
      <input type="text" id="name" autocomplete="off" placeholder="例如：王小明" />

      <label>性別</label>
      <div class="gender-row">
        <button type="button" class="gender-btn male" data-gender="男">男</button>
        <button type="button" class="gender-btn female" data-gender="女">女</button>
      </div>
    </div>

    <div id="cancelFields" class="checklist" hidden></div>

    <button type="submit" class="submit-btn" id="submitBtn" disabled>送出</button>
  </form>

  <div id="logFields" hidden></div>
  <div id="resultFields" hidden></div>

<script>
  // 這個頁面是獨立的靜態頁面，跟 PWA 主體（登入、雲端同步）完全無關。
  //
  // 代報名／代取消：送出時直接呼叫 relay Worker 的 POST /line/daibao-register
  // 或 /line/daibao-cancel，結果只顯示在這個頁面裡——**不會**送出任何訊息
  // 回聊天室（不用 liff.sendMessages()）。下次有人查 #日期 或 $日期 才會
  // 看到更新後的名單。這兩支 API 都需要知道「你是誰」（lineUserId），來自
  // liff.getDecodedIDToken()，所以 LIFF app 的 Scope 一定要有勾選
  // `openid`（`chat_message.write` 已經用不到了，可以不用勾）。
  // 代取消的勾選清單另外呼叫 GET /line/cancelable 查「這個 LINE 使用者在
  // 這場次可以取消的人」（自己＋自己代報名的人）。
  //
  // 記錄：純唯讀顯示，呼叫 GET /line/session-log 拿這個場次的操作歷史直接
  // 畫出來，一樣不會送出任何訊息回聊天室。
  //
  // 部署前請把下面兩個值改成你自己的設定：
  // - LIFF_ID：LINE Developers Console 建立 LIFF app 拿到的 ID
  //   （步驟看 relay/README.md 的「代報名（LIFF）設定」章節）
  // - RELAY_BASE_URL：你部署 relay/ 這個 Worker 的網址（跟 app/js/config.js
  //   裡的 API_BASE_URL 是同一個）
  const LIFF_ID = '2011403632-tc3TOVTY';
  const RELAY_BASE_URL = 'https://sunday-roster-m-relay.autoing.workers.dev';
</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const heading = $('heading');
  const subtitle = $('subtitle');
  const form = $('form');
  const registerFields = $('registerFields');
  const cancelFields = $('cancelFields');
  const logFields = $('logFields');
  const resultFields = $('resultFields');
  const nameInput = $('name');
  const submitBtn = $('submitBtn');
  const statusEl = $('status');
  const genderBtns = Array.from(document.querySelectorAll('.gender-btn'));
  let selectedGender = null;
  let cancelItems = []; // [{id, name, gender, registeredForSelf}]

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isError ? ' error' : '');
  }

  function readParams() {
    const query = new URLSearchParams(window.location.search);
    let params = query;
    // LIFF 有時會把原本帶的參數包進 liff.state 這個欄位裡（依進入方式而定），
    // 兩種情況都要能正確解析出 date / mode。
    if (query.has('liff.state')) {
      const state = query.get('liff.state');
      const qIndex = state.indexOf('?');
      if (qIndex >= 0) params = new URLSearchParams(state.slice(qIndex + 1));
    }
    const rawMode = params.get('mode');
    return {
      date: params.get('date'),
      sid: params.get('sid'),
      mode: rawMode === 'cancel' ? 'cancel' : rawMode === 'log' ? 'log' : 'register',
    };
  }

  function formatDateLabel(dateStr) {
    const m = String(dateStr || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return dateStr || '';
    return `${m[1]}/${Number(m[2])}/${Number(m[3])}`;
  }

  function updateRegisterSubmitState() {
    submitBtn.disabled = !(nameInput.value.trim() && selectedGender);
  }

  function updateCancelSubmitState() {
    submitBtn.disabled = !cancelFields.querySelector('input[type="checkbox"]:checked');
  }

  genderBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      selectedGender = btn.dataset.gender;
      genderBtns.forEach((b) => b.classList.toggle('selected', b === btn));
      updateRegisterSubmitState();
    });
  });
  nameInput.addEventListener('input', updateRegisterSubmitState);

  const { date, sid, mode } = readParams();

  function renderCancelChecklist(items, myUserId) {
    cancelItems = items;
    if (!items.length) {
      // 順便印出這次查詢用的 LINE 使用者 ID，方便跟在聊天室打 $userid 拿到
      // 的 ID 比對——如果兩個不一樣，通常是這個 LIFF app 掛的 Channel跟你
      // 機器人的 Messaging API Channel 不屬於同一個 Provider，導致 LINE
      // 給的使用者 ID 對不起來（見 relay/README.md 的疑難排解說明）。
      cancelFields.innerHTML = `<p class="empty-note">目前沒有可以取消的報名（可能是你還沒報名或代報名任何人，或已經被取消過了）。<br>你的識別碼：${escapeHtml(myUserId || '')}</p>`;
      submitBtn.disabled = true;
      return;
    }
    cancelFields.innerHTML = items.map((item, i) => `
      <label class="check-item">
        <input type="checkbox" data-index="${i}" />
        <span class="who">${escapeHtml(item.name)}（${item.gender}）${item.registeredForSelf ? '<span class="tag">本人</span>' : ''}</span>
      </label>
    `).join('');
    cancelFields.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
      cb.addEventListener('change', updateCancelSubmitState);
    });
    updateCancelSubmitState();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str ?? '');
    return div.innerHTML;
  }

  // 代報名/代取消成功後顯示的最新名單摘要——取代原本「報名成功」這種純
  // 文字訊息，直接讓人看到結果，不用再回去聊天室查一次。
  function renderRosterSummary(roster) {
    if (!roster) { resultFields.innerHTML = ''; return; }
    const groups = [
      ['女', roster.female],
      ['男', roster.male],
      ['候補', roster.waitlist],
    ].filter(([, names]) => names && names.length);
    if (!groups.length) {
      resultFields.innerHTML = '<p class="empty-note">目前這場次還沒有人。</p>';
      return;
    }
    resultFields.innerHTML = '<div class="roster-summary">' + groups.map(([label, names]) => `
      <div class="roster-group"><span class="label">${label}（${names.length}）</span>${escapeHtml(names.join('、'))}</div>
    `).join('') + '</div>';
  }

  function formatLogTime(ts) {
    try {
      return new Date(ts).toLocaleString('zh-TW', {
        timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
      });
    } catch (e) {
      return '';
    }
  }

  async function loadSessionLog() {
    setStatus('載入操作紀錄中…');
    if (!sid) {
      setStatus('缺少場次 ID，請重新從名單卡片點擊「記錄」按鈕進入。', true);
      return;
    }
    if (!RELAY_BASE_URL || RELAY_BASE_URL.includes('請貼上')) {
      setStatus('daibao.html 裡的 RELAY_BASE_URL 尚未設定，請先完成部署設定。', true);
      return;
    }
    try {
      const res = await fetch(`${RELAY_BASE_URL.replace(/\/$/, '')}/line/session-log?sessionId=${encodeURIComponent(sid)}`);
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.error || '載入失敗，請稍後再試。', true);
        return;
      }
      setStatus('');
      const items = data.items || [];
      if (!items.length) {
        logFields.innerHTML = '<p class="empty-note">目前沒有任何操作紀錄。</p>';
        return;
      }
      logFields.innerHTML = items.map((item) => `
        <div class="log-item">
          <span class="time">${escapeHtml(formatLogTime(item.createdAt))}</span>
          <span class="who">${escapeHtml(item.actor)}</span>
          <span class="action">${escapeHtml(item.action)}</span>
        </div>
      `).join('') + (data.hasMore ? '<p class="log-more">僅顯示最近 20 筆</p>' : '');
    } catch (err) {
      console.error(err);
      setStatus('載入失敗，請確認網路連線。', true);
    }
  }

  async function loadCancelChecklist() {
    setStatus('載入可取消名單中…');
    const ctx = liff.getContext();

    const myUserId = getMyUserId();
    if (!myUserId) {
      setStatus('無法取得您的身分資訊，請確認 LIFF app 的 Scope 有勾選 openid。', true);
      cancelFields.innerHTML = '';
      return;
    }

    // 一對一聊天室（utou）沒有 groupId/roomId——這種情境下「聊天室」本身
    // 就是「你自己跟機器人的對話」，跟後端判斷 chatId 的邏輯一致，直接用
    // 自己的 LINE 使用者 ID 當 chatId。
    const chatId = ctx.type === 'group' ? ctx.groupId
      : ctx.type === 'room' ? ctx.roomId
      : ctx.type === 'utou' ? myUserId
      : null;
    if (!chatId) {
      // 印出實際偵測到的 context 類型，方便排查——正常從群組的名單卡片點
      // 進來時這裡應該要是 "group"。
      setStatus(`請在聊天室的名單卡片中開啟此頁面。（偵測到的類型：${ctx.type || '（無）'}）`, true);
      cancelFields.innerHTML = '';
      return;
    }
    if (!RELAY_BASE_URL || RELAY_BASE_URL.includes('請貼上')) {
      setStatus('daibao.html 裡的 RELAY_BASE_URL 尚未設定，請先完成部署設定。', true);
      cancelFields.innerHTML = '';
      return;
    }
    try {
      const sidParam = sid ? `&sessionId=${encodeURIComponent(sid)}` : '';
      const res = await fetch(`${RELAY_BASE_URL.replace(/\/$/, '')}/line/cancelable?date=${encodeURIComponent(date)}&chatId=${encodeURIComponent(chatId)}&lineUserId=${encodeURIComponent(myUserId)}${sidParam}`);
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.error || '載入失敗，請稍後再試。', true);
        cancelFields.innerHTML = '';
        return;
      }
      setStatus('');
      renderCancelChecklist(data.items || [], myUserId);
    } catch (err) {
      console.error(err);
      setStatus('載入失敗，請確認網路連線。', true);
      cancelFields.innerHTML = '';
    }
  }

  if (mode === 'cancel') {
    document.title = '取消';
    heading.textContent = '代取消報名';
    subtitle.textContent = `勾選要取消 ${formatDateLabel(date)} 場次的人（只會列出你自己或你代報名的人）`;
    form.classList.add('cancel-mode');
    registerFields.hidden = true;
    cancelFields.hidden = false;
    submitBtn.textContent = '取消報名';
  } else if (mode === 'log') {
    document.title = '記錄';
    heading.textContent = '操作紀錄';
    subtitle.textContent = `${formatDateLabel(date)} 場次的報名/取消紀錄`;
    form.hidden = true;
    logFields.hidden = false;
  } else {
    document.title = '代報名';
    subtitle.textContent = `幫別人報名 ${formatDateLabel(date)} 的場次`;
  }

  // sid（場次 ID）現在是代報名/代取消直接呼叫 API 的必要參數，不是可有可
  // 無的提示了——沒有的話（例如舊卡片的按鈕網址還沒帶 sid）就先擋下來，
  // 不要讓表單看起來能填、送出卻一定失敗。
  if (mode !== 'log' && (!date || !sid)) {
    setStatus('缺少場次資訊，請重新從名單卡片點擊按鈕進入。', true);
    submitBtn.disabled = true;
    nameInput.disabled = true;
    genderBtns.forEach((b) => (b.disabled = true));
  }

  function getMyUserId() {
    try { return liff.getDecodedIDToken()?.sub || null; } catch (e) { return null; }
  }

  async function apiPost(path, payload) {
    const res = await fetch(`${RELAY_BASE_URL.replace(/\/$/, '')}${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* ignore */ }
    if (!res.ok) throw new Error(data.error || `請求失敗（HTTP ${res.status}）`);
    return data;
  }

  // 代報名/代取消現在是直接呼叫 relay 的 API，不會再用 liff.sendMessages()
  // 把訊息貼進聊天室——結果只顯示在這個頁面裡，群組/聊天室完全不會跳出任
  // 何訊息。下次有人查 #日期 或 $日期 才會看到更新後的名單。
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!sid) return;

    const myUserId = getMyUserId();
    if (!myUserId) {
      setStatus('無法取得您的身分資訊，請確認 LIFF app 的 Scope 有勾選 openid。', true);
      return;
    }

    submitBtn.disabled = true;
    setStatus('送出中…');

    // 成功時不顯示「報名成功」這種文字，直接把表單換成最新名單；失敗原因
    // （包含勾選多人時部分失敗的那幾個）還是要顯示出來。
    try {
      let success = false;
      let roster = null;
      let failedText = '';

      if (mode === 'cancel') {
        const checked = Array.from(cancelFields.querySelectorAll('input[type="checkbox"]:checked'))
          .map((cb) => cancelItems[Number(cb.dataset.index)])
          .filter(Boolean);
        if (!checked.length) { submitBtn.disabled = false; setStatus(''); return; }
        const data = await apiPost('/line/daibao-cancel', {
          sessionId: sid,
          lineUserId: myUserId,
          items: checked.map((item) => ({ id: item.id, name: item.name, gender: item.gender })),
        });
        const canceled = data.canceled || [];
        const failed = data.failed || [];
        success = canceled.length > 0;
        if (failed.length) failedText = `⚠️ 未取消：${failed.join('、')}`;
        if (success) roster = data.roster;
      } else {
        const name = nameInput.value.trim();
        if (!name || !selectedGender) { submitBtn.disabled = false; setStatus(''); return; }
        const data = await apiPost('/line/daibao-register', {
          sessionId: sid,
          lineUserId: myUserId,
          name,
          gender: selectedGender,
        });
        success = Boolean(data.added);
        if (!success) failedText = data.message || '⚠️ 已經在本場次名單中';
        if (success) roster = data.roster;
      }

      if (success) {
        setStatus(failedText, Boolean(failedText));
        form.hidden = true;
        renderRosterSummary(roster);
        resultFields.hidden = false;
      } else {
        setStatus(failedText, true);
        submitBtn.disabled = false;
      }
    } catch (err) {
      console.error(err);
      setStatus(err.message || '送出失敗，請稍後再試。', true);
      submitBtn.disabled = false;
    }
  });

  liff.init({ liffId: LIFF_ID }).then(() => {
    if (!liff.isInClient()) {
      setStatus('請在 LINE App 內、從聊天室的名單卡片點擊按鈕使用這個功能。', true);
      submitBtn.disabled = true;
      return;
    }
    if (mode === 'cancel') loadCancelChecklist();
    else if (mode === 'log') loadSessionLog();
  }).catch((err) => {
    console.error(err);
    setStatus('LIFF 初始化失敗，請確認 daibao.html 裡的 LIFF_ID 是否已正確設定。', true);
    submitBtn.disabled = true;
  });
})();
</script>
</body>
</html>
