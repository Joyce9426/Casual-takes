<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>代報名</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #F5F7F8;
    color: #16211C;
    padding: 20px 18px 32px;
  }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .subtitle { font-size: 13px; color: #6C6C6C; margin: 0 0 20px; }
  label { display: block; font-size: 14px; font-weight: bold; margin: 16px 0 8px; }
  input[type="text"] {
    width: 100%;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid #D5DAD8;
    border-radius: 8px;
    background: #fff;
  }
  .gender-row { display: flex; gap: 10px; }
  .gender-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 8px;
    border: 1px solid #D5DAD8;
    background: #fff;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
  }
  .gender-btn.selected.male { background: #4A90E2; border-color: #4A90E2; color: #fff; }
  .gender-btn.selected.female { background: #E24A8E; border-color: #E24A8E; color: #fff; }
  .submit-btn {
    width: 100%;
    margin-top: 26px;
    padding: 14px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #0F6E56;
  }
  .submit-btn:disabled { background: #A9B7B1; }
  .cancel-mode .submit-btn { background: #B3261E; }
  .status { margin-top: 18px; font-size: 14px; color: #6C6C6C; text-align: center; min-height: 20px; }
  .status.error { color: #B3261E; }
</style>
</head>
<body>
  <h1 id="heading">代報名</h1>
  <p class="subtitle" id="subtitle">請輸入要報名的人的姓名與性別</p>

  <form id="form">
    <label for="name">姓名</label>
    <input type="text" id="name" autocomplete="off" placeholder="例如：王小明" required />

    <label>性別</label>
    <div class="gender-row">
      <button type="button" class="gender-btn male" data-gender="男">男</button>
      <button type="button" class="gender-btn female" data-gender="女">女</button>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn" disabled>送出</button>
  </form>

  <p class="status" id="status"></p>

<script>
  // 這個頁面是獨立的靜態頁面，跟 PWA 主體（登入、雲端同步）完全無關，也不需要
  // 呼叫 relay Worker 的任何 API —— 送出表單時是用 liff.sendMessages() 把
  // 「代報名 日期 姓名 性別」這句文字用「使用者身分」送進原本的聊天室，機器人
  // 會把它當成一般文字訊息處理（跟直接手動打字一樣），這樣才能用 Reply API
  // 回覆結果，不用 Push（LINE Push 有次數限制，Reply 沒有）。
  //
  // 部署前請把下面這行改成你自己在 LINE Developers Console 建立的 LIFF ID
  // （設定步驟看 relay/README.md 的「代報名（LIFF）設定」章節）。
  const LIFF_ID = '2011403632-tc3TOVTY';
</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const heading = $('heading');
  const subtitle = $('subtitle');
  const form = $('form');
  const nameInput = $('name');
  const submitBtn = $('submitBtn');
  const statusEl = $('status');
  const genderBtns = Array.from(document.querySelectorAll('.gender-btn'));
  let selectedGender = null;

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (isError ? ' error' : '');
  }

  function readParams() {
    const query = new URLSearchParams(window.location.search);
    let params = query;
    // LIFF 有時會把原本帶的參數包進 liff.state 這個欄位裡（依進入方式而定），
    // 兩種情況都要能正確解析出 date / mode。
    if (query.has('liff.state')) {
      const state = query.get('liff.state');
      const qIndex = state.indexOf('?');
      if (qIndex >= 0) params = new URLSearchParams(state.slice(qIndex + 1));
    }
    return { date: params.get('date'), mode: params.get('mode') === 'cancel' ? 'cancel' : 'register' };
  }

  function formatDateLabel(dateStr) {
    const m = String(dateStr || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return dateStr || '';
    return `${m[1]}/${Number(m[2])}/${Number(m[3])}`;
  }

  function updateSubmitState() {
    submitBtn.disabled = !(nameInput.value.trim() && selectedGender);
  }

  genderBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      selectedGender = btn.dataset.gender;
      genderBtns.forEach((b) => b.classList.toggle('selected', b === btn));
      updateSubmitState();
    });
  });
  nameInput.addEventListener('input', updateSubmitState);

  const { date, mode } = readParams();
  if (mode === 'cancel') {
    heading.textContent = '代取消報名';
    subtitle.textContent = `取消 ${formatDateLabel(date)} 場次中某人的報名（只能取消你自己或你代報名的人）`;
    form.classList.add('cancel-mode');
    submitBtn.textContent = '送出取消';
  } else {
    subtitle.textContent = `幫別人報名 ${formatDateLabel(date)} 的場次`;
  }

  if (!date) {
    setStatus('缺少場次日期，請重新從名單卡片點擊按鈕進入。', true);
    submitBtn.disabled = true;
    nameInput.disabled = true;
    genderBtns.forEach((b) => (b.disabled = true));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name || !selectedGender || !date) return;

    submitBtn.disabled = true;
    setStatus('送出中…');

    const command = mode === 'cancel' ? '代取消' : '代報名';
    const text = `${command} ${date} ${name} ${selectedGender}`;

    try {
      await liff.sendMessages([{ type: 'text', text }]);
      setStatus('已送出，請回到聊天室查看結果。');
      setTimeout(() => { try { liff.closeWindow(); } catch (e2) {} }, 600);
    } catch (err) {
      console.error(err);
      setStatus('送出失敗：請確認是從聊天室裡的名單卡片點按鈕進入這個頁面的。', true);
      submitBtn.disabled = false;
    }
  });

  liff.init({ liffId: LIFF_ID }).then(() => {
    if (!liff.isInClient()) {
      setStatus('請在 LINE App 內、從聊天室的名單卡片點擊按鈕使用這個功能。', true);
      submitBtn.disabled = true;
    }
  }).catch((err) => {
    console.error(err);
    setStatus('LIFF 初始化失敗，請確認 daibao.html 裡的 LIFF_ID 是否已正確設定。', true);
    submitBtn.disabled = true;
  });
})();
</script>
</body>
</html>
