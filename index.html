<style>
  /* 啟動畫面（splash）：全部 inline，不依賴外部 CSS，才能在 styles.css / 字型
     還沒載入前就先畫出來，避免開啟 PWA 時先閃一下白畫面。 */
  html, body { margin: 0; background: #F3F6F4; }
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #F3F6F4;
    transition: opacity .28s ease;
  }
  #splash.splash-hide { opacity: 0; pointer-events: none; }
  #splash-svg { width: min(56vw, 240px); height: auto; overflow: visible; }
  #splash-svg path:nth-of-type(n + 3) {
    transform-box: view-box;
    transform-origin: 472px 1063.432px;
    animation: splash-ball-spin 1.6s linear infinite;
  }
  @keyframes splash-ball-spin { to { transform: rotate(360deg); } }
  #splash-svg .loading-letter {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: splash-letter-bounce 1.2s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  #splash-svg .loading-letter:nth-child(1) { animation-delay: 0s; }
  #splash-svg .loading-letter:nth-child(2) { animation-delay: 0.1s; }
  #splash-svg .loading-letter:nth-child(3) { animation-delay: 0.2s; }
  #splash-svg .loading-letter:nth-child(4) { animation-delay: 0.3s; }
  #splash-svg .loading-letter:nth-child(5) { animation-delay: 0.4s; }
  #splash-svg .loading-letter:nth-child(6) { animation-delay: 0.5s; }
  #splash-svg .loading-letter:nth-child(7) { animation-delay: 0.6s; }
  #splash-svg .loading-letter:nth-child(8) { animation-delay: 0.7s; }
  #splash-svg .loading-letter:nth-child(9) { animation-delay: 0.8s; }
  #splash-svg .loading-letter:nth-child(10) { animation-delay: 0.9s; }
  @keyframes splash-letter-bounce {
    0%, 60%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-24px) scale(1.06, .94); }
    45% { transform: translateY(3px) scale(.97, 1.03); }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash-svg path:nth-of-type(n + 3), #splash-svg .loading-letter { animation: none; }
    #splash { transition: none; }
  }
</style>

  // 避免熱啟動時動畫一閃而過。
  (function () {
    var done = false;
    window.__hideSplash = function () {
      if (done) return;
      done = true;
      var el = document.getElementById('splash');
      if (!el) return;
      var wait = Math.max(0, 400 - performance.now());
      setTimeout(function () {
        el.classList.add('splash-hide');
        setTimeout(function () { el.remove(); }, 400);
      }, wait);
    };
    setTimeout(window.__hideSplash, 8000);
  })();
</script>
